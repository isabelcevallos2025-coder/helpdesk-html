<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Kit - Help Desk</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>UI Kit - Sistema Help Desk</h1>
    <p>Biblioteca de Componentes</p>
</header>

<main class="contenedor">

    <section>
        <h2>Botones</h2>

        <button class="btn btn-primary">Guardar</button>
        <button class="btn btn-secondary">Editar</button>
        <button class="btn btn-danger">Eliminar</button>

    </section>

    <section>

        <h2>Campos de Texto</h2>

        <input type="text" placeholder="Ingrese su nombre">

        <input type="email" placeholder="Ingrese su correo">

        <textarea placeholder="Descripción del incidente"></textarea>

    </section>

    <section>

        <h2>Tarjeta</h2>

        <div class="card">

            <h3>Incidente #001</h3>

            <p>Error al iniciar sesión en el sistema.</p>

            <button class="btn btn-primary">Ver detalle</button>

        </div>

    </section>

    <section>

        <h2>Alertas</h2>

        <div class="alert success">
            Incidente registrado correctamente.
        </div>

        <div class="alert warning">
            Revise los datos ingresados.
        </div>

        <div class="alert danger">
            Error al guardar la información.
        </div>

    </section>

</main>

</body>
</html>
